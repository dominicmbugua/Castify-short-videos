<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Submit a video</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  :root {
    --bg: #14181D;
    --panel: #1B2027;
    --panel-raised: #212832;
    --line: #2C333D;
    --text-primary: #E7EAEE;
    --text-muted: #8B95A5;
    --text-faint: #5B6472;
    --accent: #4FB0A5;
    --accent-dim: #2E4744;
    --danger: #D97066;
    --danger-dim: #3A2724;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }

  .wrap { width: 100%; max-width: 560px; }

  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 6px 0;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-muted);
    margin: 0 0 32px 0;
  }

  section { margin-bottom: 28px; }

  .divider {
    height: 1px;
    background: var(--line);
    margin-bottom: 28px;
    border: none;
  }

  label.field-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    display: block;
    margin-bottom: 8px;
  }

  .field-hint {
    display: block;
    font-size: 12.5px;
    color: var(--text-faint);
    line-height: 1.4;
    font-weight: 400;
    margin-top: 2px;
  }

  input[type="text"], input[type="url"], input[type="number"] {
    width: 100%;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--text-primary);
    font-family: inherit;
    outline: none;
    transition: border-color 120ms ease;
  }

  input[type="number"] { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  input:focus { border-color: var(--accent); }
  input.error { border-color: var(--danger); }

  .error-text {
    font-size: 12.5px;
    color: var(--danger);
    margin-top: 6px;
    min-height: 0;
  }

  /* source toggle */
  .source-toggle {
    display: inline-flex;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 3px;
    gap: 2px;
    margin-bottom: 14px;
  }

  .source-toggle button {
    border: none;
    cursor: pointer;
    padding: 7px 16px;
    font-size: 13.5px;
    font-weight: 500;
    border-radius: 5px;
    font-family: inherit;
    background: transparent;
    color: var(--text-muted);
    transition: background 120ms ease, color 120ms ease;
  }

  .source-toggle button.active {
    background: var(--accent-dim);
    color: var(--accent);
  }

  .source-panel { display: none; }
  .source-panel.active { display: block; }

  /* single number inputs */
  .num-wrap { position: relative; }

  .num-suffix {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12.5px;
    color: var(--text-faint);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    pointer-events: none;
  }

  .num-wrap.has-suffix input { padding-right: 40px; }

  /* file picker */
  .file-picker {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: var(--panel-raised);
    border: 1px dashed var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 13.5px;
    color: var(--text-muted);
    cursor: pointer;
  }

  .file-picker.error { border-color: var(--danger); }

  .file-picker .badge {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-dim);
    border-radius: 4px;
    padding: 3px 8px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    flex-shrink: 0;
  }

  .file-picker .filename {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .file-picker input[type="file"] { display: none; }

  /* format options */
  .format-options { display: flex; gap: 10px; }

  .format-option {
    flex: 1;
    text-align: left;
    cursor: pointer;
    padding: 12px 14px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--panel-raised);
    font-family: inherit;
    color: inherit;
  }

  .format-option.selected {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .format-option .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .format-option .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1.5px solid var(--text-faint);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .format-option.selected .dot { border-color: var(--accent); }

  .format-option .dot-inner {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    display: none;
  }

  .format-option.selected .dot-inner { display: block; }

  .format-option .title {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .format-option .suggested {
    font-size: 10.5px;
    color: var(--accent);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    margin-left: auto;
  }

  .format-option .description {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  /* submit */
  button.submit {
    width: 100%;
    padding: 12px 0;
    border-radius: 7px;
    border: none;
    background: var(--accent);
    color: #0F1613;
    font-size: 14.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }

  button.submit.disabled-look {
    background: var(--panel-raised);
    color: var(--text-faint);
  }

  button.submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .submit-hint {
    text-align: center;
    font-size: 12.5px;
    color: var(--text-faint);
    margin-top: 10px;
    min-height: 0;
  }

  /* ---- result modal ---- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 15, 0.66);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }

  .modal-overlay.active { display: flex; }

  .modal-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
  }

  .modal-icon {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 20px;
    font-weight: 700;
  }

  .modal-icon.success { background: var(--accent-dim); color: var(--accent); }
  .modal-icon.error { background: var(--danger-dim); color: var(--danger); }

  .modal-title {
    font-size: 16.5px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .modal-message {
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 20px;
  }

  .modal-detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 12.5px;
    margin-bottom: 8px;
    text-align: left;
  }

  .modal-detail-row .label { color: var(--text-faint); flex-shrink: 0; }

  .modal-detail-row .value {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: rtl;
    text-align: left;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .modal-actions button {
    flex: 1;
    padding: 10px 0;
    border-radius: 7px;
    font-size: 13.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--panel-raised);
    color: var(--text-primary);
  }

  .modal-actions button.primary {
    background: var(--accent);
    color: #0F1613;
    border-color: var(--accent);
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>Submit a video</h1>

    <div style="text-align: right; margin-top: -34px; margin-bottom: 24px;">
    <a href="dashboard.html" style="font-size: 13px; color: var(--accent); text-decoration: none;">View dashboard →</a>
  </div>
  <p class="subtitle">We'll cut it into vertical clips and drop them in a Drive folder for review.</p>

  <form id="submission-form" novalidate>

    <!-- Email -->
    <section>
      <label class="field-label" for="email">Email address</label>
      <input type="text" id="email" placeholder="you@example.com" autocomplete="email" />
      <div class="error-text" id="email-error"></div>
    </section>

    <hr class="divider" />

    <!-- Source -->
    <section>
      <label class="field-label">
        Video source
        <span class="field-hint">Choose one — switching clears the others.</span>
      </label>

      <div class="source-toggle" id="source-toggle">
        <button type="button" data-source="url" class="active">URL</button>
        <button type="button" data-source="file">File upload</button>
        <button type="button" data-source="zip">ZIP upload</button>
      </div>

      <div class="source-panel active" data-panel="url">
        <input type="url" id="source-url" placeholder="https://example.com/my-video.mp4" />
      </div>

      <div class="source-panel" data-panel="file">
        <label class="file-picker" id="file-picker-file">
          <span class="badge">BROWSE</span>
          <span class="filename" id="file-name-file">Choose a video file (MP4, MOV, MKV)</span>
          <input type="file" id="source-file" accept="video/mp4,video/quicktime,video/x-matroska" />
        </label>
      </div>

      <div class="source-panel" data-panel="zip">
        <label class="file-picker" id="file-picker-zip">
          <span class="badge">BROWSE</span>
          <span class="filename" id="file-name-zip">Choose a ZIP of videos (max 20)</span>
          <input type="file" id="source-zip" accept=".zip" />
        </label>
      </div>

      <div class="error-text" id="source-error"></div>
    </section>

    <hr class="divider" />

    <!-- Clip duration -->
    <section>
      <label class="field-label" for="clip-duration">
        Clip duration
        <span class="field-hint">Every clip will be this many seconds long.</span>
      </label>
      <div class="num-wrap has-suffix">
        <input type="number" id="clip-duration" min="1" step="1" value="30" />
        <span class="num-suffix">sec</span>
      </div>
      <div class="error-text" id="clip-duration-error"></div>
    </section>

    <!-- Max clips -->
    <section>
      <label class="field-label" for="max-clips">
        Max clips per video
        <span class="field-hint">How many clips to attempt per video — fewer will be made if the source is too short.</span>
      </label>
      <div class="num-wrap">
        <input type="number" id="max-clips" min="1" step="1" value="10" />
      </div>
      <div class="error-text" id="max-clips-error"></div>
    </section>

    <hr class="divider" />

    <!-- Vertical format -->
    <section>
      <label class="field-label">
        Vertical format
        <span class="field-hint">How landscape footage fits a 9:16 frame.</span>
      </label>
      <div class="format-options" id="format-options">
        <button type="button" class="format-option selected" data-format="pad_canvas">
          <div class="row">
            <span class="dot"><span class="dot-inner"></span></span>
            <span class="title">Pad to canvas</span>
            <span class="suggested">suggested</span>
          </div>
          <div class="description">Keeps the full frame, adds blurred bars top and bottom.</div>
        </button>
        <button type="button" class="format-option" data-format="center_crop">
          <div class="row">
            <span class="dot"><span class="dot-inner"></span></span>
            <span class="title">Center crop</span>
          </div>
          <div class="description">Fills the frame, trims the left and right edges.</div>
        </button>
      </div>
    </section>

    <button type="submit" class="submit" id="submit-btn">Submit video</button>
    <div class="submit-hint" id="submit-hint"></div>
  </form>
</div>

<!-- ---- result modal ---- -->
<div class="modal-overlay" id="result-modal">
  <div class="modal-card">
    <div class="modal-icon" id="modal-icon"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-message" id="modal-message"></div>

    <div id="modal-success-details">
      <div class="modal-detail-row">
        <span class="label">Job ID</span>
        <span class="value" id="modal-job-id"></span>
      </div>
      <div class="modal-detail-row">
        <span class="label">Status</span>
        <span class="value" id="modal-job-status"></span>
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" id="modal-copy-btn">Copy status URL</button>
      <button type="button" class="primary" id="modal-close-btn">Done</button>
    </div>
  </div>
</div>

<script>
  // ---- state -----------------------------------------------------
  const state = {
    sourceType: "url",       // url | file | zip — exclusive
    sourceUrl: "",
    sourceFile: null,
    sourceZip: null,
    verticalFormat: "pad_canvas",
    touched: false,
  };

  const els = {
    email: document.getElementById("email"),
    emailError: document.getElementById("email-error"),
    sourceToggle: document.getElementById("source-toggle"),
    sourceUrl: document.getElementById("source-url"),
    sourceFile: document.getElementById("source-file"),
    sourceZip: document.getElementById("source-zip"),
    fileNameFile: document.getElementById("file-name-file"),
    fileNameZip: document.getElementById("file-name-zip"),
    filePickerFile: document.getElementById("file-picker-file"),
    filePickerZip: document.getElementById("file-picker-zip"),
    sourceError: document.getElementById("source-error"),
    clipDuration: document.getElementById("clip-duration"),
    clipDurationError: document.getElementById("clip-duration-error"),
    maxClips: document.getElementById("max-clips"),
    maxClipsError: document.getElementById("max-clips-error"),
    formatOptions: document.getElementById("format-options"),
    form: document.getElementById("submission-form"),
    submitBtn: document.getElementById("submit-btn"),
    submitHint: document.getElementById("submit-hint"),
    modal: document.getElementById("result-modal"),
    modalIcon: document.getElementById("modal-icon"),
    modalTitle: document.getElementById("modal-title"),
    modalMessage: document.getElementById("modal-message"),
    modalSuccessDetails: document.getElementById("modal-success-details"),
    modalJobId: document.getElementById("modal-job-id"),
    modalJobStatus: document.getElementById("modal-job-status"),
    modalCopyBtn: document.getElementById("modal-copy-btn"),
    modalCloseBtn: document.getElementById("modal-close-btn"),
  };

  // ---- exclusive source-type toggle -------------------------------
  els.sourceToggle.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-source]");
    if (!btn) return;
    const next = btn.dataset.source;

    state.sourceType = next;
    // clear the other two sources so only one can ever be set
    if (next !== "url") { state.sourceUrl = ""; els.sourceUrl.value = ""; }
    if (next !== "file") {
      state.sourceFile = null;
      els.sourceFile.value = "";
      els.fileNameFile.textContent = "Choose a video file (MP4, MOV, MKV)";
    }
    if (next !== "zip") {
      state.sourceZip = null;
      els.sourceZip.value = "";
      els.fileNameZip.textContent = "Choose a ZIP of videos (max 20)";
    }

    els.sourceToggle.querySelectorAll("button").forEach((b) =>
      b.classList.toggle("active", b.dataset.source === next)
    );
    document.querySelectorAll(".source-panel").forEach((p) =>
      p.classList.toggle("active", p.dataset.panel === next)
    );

    validate();
  });

  els.sourceUrl.addEventListener("input", (e) => {
    state.sourceUrl = e.target.value;
    validate();
  });

  els.sourceFile.addEventListener("change", (e) => {
    const f = e.target.files[0] || null;
    state.sourceFile = f;
    els.fileNameFile.textContent = f ? f.name : "Choose a video file (MP4, MOV, MKV)";
    validate();
  });

  els.sourceZip.addEventListener("change", (e) => {
    const f = e.target.files[0] || null;
    state.sourceZip = f;
    els.fileNameZip.textContent = f ? f.name : "Choose a ZIP of videos (max 20)";
    validate();
  });

  // ---- vertical format selector ------------------------------------
  els.formatOptions.addEventListener("click", (e) => {
    const btn = e.target.closest(".format-option");
    if (!btn) return;
    state.verticalFormat = btn.dataset.format;
    els.formatOptions.querySelectorAll(".format-option").forEach((b) =>
      b.classList.toggle("selected", b === btn)
    );
  });

  // ---- validation (lightweight client-side only) --------------------
  function emailValid() {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email || els.email.value);
  }

  function sourceProvided() {
    if (state.sourceType === "url") return state.sourceUrl.trim().length > 0;
    if (state.sourceType === "file") return !!state.sourceFile;
    if (state.sourceType === "zip") return !!state.sourceZip;
    return false;
  }

  function isPositiveInt(rawValue) {
    const n = Number(rawValue);
    return rawValue !== "" && Number.isInteger(n) && n >= 1;
  }

  function clipDurationValid() {
    return isPositiveInt(els.clipDuration.value);
  }

  function maxClipsValid() {
    return isPositiveInt(els.maxClips.value);
  }

  function formValid() {
    return emailValid() && sourceProvided() && clipDurationValid() && maxClipsValid();
  }

  function validate() {
    const valid = formValid();

    if (state.touched) {
      const eValid = emailValid();
      els.email.classList.toggle("error", !eValid);
      els.emailError.textContent = eValid ? "" : "Enter a valid email address.";

      const sOk = sourceProvided();
      els.sourceUrl.classList.toggle("error", state.sourceType === "url" && !sOk);
      els.filePickerFile.classList.toggle("error", state.sourceType === "file" && !sOk);
      els.filePickerZip.classList.toggle("error", state.sourceType === "zip" && !sOk);
      els.sourceError.textContent = sOk ? "" : "A video source is required.";

      const dOk = clipDurationValid();
      els.clipDuration.classList.toggle("error", !dOk);
      els.clipDurationError.textContent = dOk
        ? ""
        : "Enter a whole number of seconds (1 or more).";

      const mOk = maxClipsValid();
      els.maxClips.classList.toggle("error", !mOk);
      els.maxClipsError.textContent = mOk
        ? ""
        : "Enter a whole number of clips (1 or more).";

      els.submitHint.textContent = valid ? "" : "Fix the fields above to continue.";
    }

    els.submitBtn.classList.toggle("disabled-look", state.touched && !valid);
    return valid;
  }

  [els.email].forEach((el) =>
    el.addEventListener("input", () => {
      state.email = els.email.value;
      validate();
    })
  );

  [els.clipDuration, els.maxClips].forEach((el) =>
    el.addEventListener("input", validate)
  );

  // ---- result modal helpers ------------------------------------------
  let currentStatusUrl = "";

  function closeModal() {
    els.modal.classList.remove("active");
  }

  els.modal.addEventListener("click", (e) => {
    if (e.target === els.modal) closeModal();
  });

  els.modalCloseBtn.addEventListener("click", closeModal);

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && els.modal.classList.contains("active")) closeModal();
  });

  els.modalCopyBtn.addEventListener("click", async () => {
    if (!currentStatusUrl) return;
    try {
      await navigator.clipboard.writeText(currentStatusUrl);
      els.modalCopyBtn.textContent = "Copied!";
      setTimeout(() => { els.modalCopyBtn.textContent = "Copy status URL"; }, 1500);
    } catch {
      // clipboard API can be unavailable outside a secure context — fail silently
    }
  });

  function showSuccessModal(job) {
    currentStatusUrl = `${API_BASE}/jobs/${job.id}`;
    els.modalIcon.className = "modal-icon success";
    els.modalIcon.textContent = "\u2713"; // check mark
    els.modalTitle.textContent = "Video submitted";
    els.modalMessage.textContent = "Your job is queued for processing. Save the job ID below to check on it later.";
    els.modalJobId.textContent = job.id;
    els.modalJobStatus.textContent = job.status;
    els.modalSuccessDetails.style.display = "block";
    els.modalCopyBtn.style.display = "inline-block";
    els.modal.classList.add("active");
  }

  function showErrorModal(message) {
    currentStatusUrl = "";
    els.modalIcon.className = "modal-icon error";
    els.modalIcon.textContent = "!";
    els.modalTitle.textContent = "Submission failed";
    els.modalMessage.textContent = message;
    els.modalSuccessDetails.style.display = "none";
    els.modalCopyBtn.style.display = "none";
    els.modal.classList.add("active");
  }

  // ---- submit ---------------------------------------------------------
  const API_BASE = "http://127.0.0.1:8000";

  els.form.addEventListener("submit", async (e) => {
    e.preventDefault();
    state.touched = true;
    state.email = els.email.value;
    const valid = validate();
    if (!valid) return;

    const formData = new FormData();
    formData.append("submitter_email", state.email);
    formData.append("clip_duration_sec", els.clipDuration.value);
    formData.append("max_clips_per_video", els.maxClips.value);
    formData.append("vertical_format", state.verticalFormat);
    formData.append("source_type", state.sourceType);

    if (state.sourceType === "url") {
      formData.append("source_url", state.sourceUrl.trim());
    } else if (state.sourceType === "file") {
      formData.append("source_file", state.sourceFile);
    } else if (state.sourceType === "zip") {
      formData.append("source_file", state.sourceZip);
    }

    els.submitBtn.disabled = true;
    els.submitHint.textContent = "Submitting...";

    try {
      // NOTE: do not set a Content-Type header manually — the browser
      // sets the multipart boundary itself when the body is a FormData.
      const res = await fetch(`${API_BASE}/jobs`, {
        method: "POST",
        body: formData,
      });

      if (!res.ok) {
        const err = await res.json().catch(() => null);
        const detail = err?.detail;
        const message = typeof detail === "string"
          ? detail
          : Array.isArray(detail)
            ? detail.map((d) => d.msg || JSON.stringify(d)).join(" — ")
            : `Request failed (${res.status})`;
        throw new Error(message);
      }

      const job = await res.json();
      els.submitHint.textContent = "";
      showSuccessModal(job);

      els.form.reset();
      state.touched = false;
      state.sourceType = "url";
      state.sourceUrl = "";
      state.sourceFile = null;
      state.sourceZip = null;
      els.fileNameFile.textContent = "Choose a video file (MP4, MOV, MKV)";
      els.fileNameZip.textContent = "Choose a ZIP of videos (max 20)";
      els.sourceToggle.querySelectorAll("button").forEach((b) =>
        b.classList.toggle("active", b.dataset.source === "url")
      );
      document.querySelectorAll(".source-panel").forEach((p) =>
        p.classList.toggle("active", p.dataset.panel === "url")
      );
      els.submitBtn.classList.remove("disabled-look");
    } catch (err) {
      els.submitHint.textContent = "";
      showErrorModal(err.message || "Something went wrong. Please try again.");
    } finally {
      els.submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
